name: Actualizar dashboard AFP

on:
  # Revisa todos los dias a las 8am (hora Colombia). Si no hay corte nuevo,
  # la ejecucion tarda ~20 segundos y no hace nada, asi que revisar a diario
  # no tiene costo: simplemente el dashboard se actualiza solo al dia siguiente
  # de que la Superintendencia publique.
  schedule:
    - cron: '0 13 * * *'

  # Permite ejecutarlo a mano desde la pestana Actions cuando se necesite.
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Corte especifico a procesar (YYYY-MM-DD). Vacio = el mas reciente'
        required: false
      forzar:
        description: 'Reprocesar aunque el corte ya exista'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pandas

      - name: Buscar y procesar corte nuevo
        id: procesar
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.fecha }}" ]; then
            ARGS="$ARGS --fecha ${{ github.event.inputs.fecha }}"
          fi
          if [ "${{ github.event.inputs.forzar }}" = "true" ]; then
            ARGS="$ARGS --forzar"
          fi
          python actualizar_dashboard.py $ARGS

      - name: Publicar si hubo cambios
        run: |
          # Solo interesan estos dos archivos. Se revisan explicitamente porque
          # Python deja carpetas temporales (__pycache__) que no deben publicarse
          # ni contarse como "hubo cambios".
          if git diff --quiet -- index.html historial_portafolio.json; then
            echo "Sin cambios: no hay corte nuevo que publicar."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html historial_portafolio.json
          git commit -m "Actualizacion automatica del dashboard"
          git push
          echo "Dashboard actualizado y publicado."
